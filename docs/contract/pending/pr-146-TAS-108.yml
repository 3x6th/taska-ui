# Pending gateway contract — backend PR #146 (TAS-108)
# Admin user block/unblock and reset credential lockout (TAS-107 + TAS-108)
#
# Source: https://github.com/VladislavYurin/taska-backend/pull/146
# Head commit: 01a5af423f0f4c169aae147094d7fc8262b53d85
# PR state on 2026-09-05: open, approved by two reviewers, CONFLICTING with develop
# Base for this extract: develop @ 8b8b3c5aca210175322d5f1d092c61ffcd3cfeb3
#
# Block and unblock already shipped on the frontend in TAS-186, written against the earlier
# draft in PR #134. This head renames the response timestamp to changedAt and adds LOCKED to
# UserStatusDto — both break the shipped mapping silently. reset-lockout is new.
# Verified against api-gateway AdminUserManagementMapper.java at this sha, not the yml alone.
#
# This is NOT the contract. It is what the contract WILL say if this PR merges as it
# stands. docs/contract/openapi.yml stays the authority until then; this file exists so a
# reviewer without network access can audit frontend work written ahead of the merge, and
# so the version that work was written against is pinned in history. Delete it when the PR
# merges and the snapshot is refreshed.
#
# Extracted mechanically: every path and schema that is new in the PR, or whose text differs
# from develop. Ordering follows the PR file.

paths:

  /api/v1/admin/users/{userId}/block:
    post:
      summary: Блокировка пользователя
      description: Изменяет статус пользователя на BLOCKED. Требует прав GLOBAL_ADMIN и указания причины.
      operationId: blockUser
      tags:
        - admin-user-management
      security:
        - bearerAuth: [ ]
      parameters:
        - name: userId
          in: path
          required: true
          description: Уникальный идентификатор пользователя (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserRequestDto'
      responses:
        '200':
          description: Пользователь успешно заблокирован
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusResponseDto'
        '400':
          description: Некорректный запрос (неверный UUID или отсутствует reason)
          $ref: '#/components/responses/ErrorResponse'
        '401':
          description: Неавторизован
          $ref: '#/components/responses/ErrorResponse'
        '403':
          description: Доступ запрещен (требуется роль GLOBAL_ADMIN)
          $ref: '#/components/responses/ErrorResponse'
        '404':
          description: Пользователь не найден
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Конфликт бизнес-логики (попытка заблокировать последнего GLOBAL_ADMIN или некорректный переход статуса)
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/admin/users/{userId}/unblock:
    post:
      summary: Разблокировка пользователя
      description: Изменяет статус пользователя с BLOCKED на ACTIVE. Запрещено активировать пользователей в статусе INVITED через этот эндпоинт. Требует прав GLOBAL_ADMIN.
      operationId: unblockUser
      tags:
        - admin-user-management
      security:
        - bearerAuth: [ ]
      parameters:
        - name: userId
          in: path
          required: true
          description: Уникальный идентификатор пользователя (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnblockUserRequestDto'
      responses:
        '200':
          description: Пользователь успешно разблокирован
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusResponseDto'
        '400':
          description: Некорректный запрос (неверный формат UUID или отсутствует reason)
          $ref: '#/components/responses/ErrorResponse'
        '401':
          description: Неавторизован
          $ref: '#/components/responses/ErrorResponse'
        '403':
          description: Доступ запрещен (требуется роль GLOBAL_ADMIN)
          $ref: '#/components/responses/ErrorResponse'
        '404':
          description: Пользователь не найден
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Конфликт бизнес-логики (попытка разблокировать пользователя со статусом, отличным от BLOCKED)
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/admin/users/{userId}/reset-lockout:
    post:
      summary: Сброс блокировки учётных данных пользователя (только GLOBAL_ADMIN)
      operationId: resetCredentialLockout
      tags:
        - admin-user-management
      security:
        - bearerAuth: [ ]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetLockoutRequestDto'
      responses:
        '200':
          description: Lockout успешно сброшен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

components:
  schemas:

    NotificationTypeDto:
      type: string
      enum:
        - ISSUE_ASSIGNED
        - ISSUE_TRANSITIONED
        - ISSUE_CREATED
        - ISSUE_UPDATED
        - ISSUE_DELETED
        - USER_INVITED
        - USER_ACTIVATED
        - PROJECT_CREATED
        - MEMBER_ADDED
        - MEMBER_UPDATED
        - MEMBER_REMOVED

    BlockUserRequestDto:
      type: object
      required: [ reason ]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 550
          description: Причина блокировки пользователя (обязательное поле для аудита)
          example: "Нарушение правил безопасности"

    UnblockUserRequestDto:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 550
          description: Причина разблокировки пользователя (обязательное поле для аудита)
          example: "Блокировка снята по решению администрации после проверки"

    ResetLockoutRequestDto:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 550
          description: Причина снятия блокировки на credentials (обязательное поле для аудита)
          example: "Обещал не забывать пароль и записать в надежном месте"

    UserStatusResponseDto:
      type: object
      required: [ userId,previousStatus, currentStatus, changedAt]
      properties:
        userId:
          type: string
          format: uuid
        previousStatus:
          $ref: '#/components/schemas/UserStatusDto'
        currentStatus:
          $ref: '#/components/schemas/UserStatusDto'
        changedAt:
          type: string
          format: date-time

    UserStatusDto:
      type: string
      enum:
        - INVITED
        - ACTIVE
        - BLOCKED
        - LOCKED
