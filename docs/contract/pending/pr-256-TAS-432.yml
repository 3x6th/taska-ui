paths:
  /api/v1/projects/{projectId}/issue-types/order:
    put:
      x-pat-scope: write
      operationId: reorderProjectIssueTypes
      summary: Атомарно переставить все типы задач — только ADMIN проекта
      description: codes — полная перестановка текущего реестра без повторов. Записывает sortOrder 10, 20, 30 в одной транзакции; первый тип становится типом по умолчанию. Если корректно сформированный набор кодов не совпадает с текущим реестром, возвращается 409 ABORTED с details.reason ISSUE_TYPES_CHANGED без изменений; перечитайте реестр. Пустой список, повторы и некорректные коды — 400 INVALID_ARGUMENT.
      tags: [project-issue-type]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderProjectIssueTypesRequestDto'
      responses:
        '200':
          description: Новый порядок сохранён; реестр целиком в новом порядке, с shape и icon каждого типа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectIssueTypesDto'
        '409':
          description: ABORTED с details.reason ISSUE_TYPES_CHANGED — набор типов изменился; перечитайте реестр и повторите перестановку.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/projects/{projectId}/issue-types/{code}:
    patch:
      x-pat-scope: write
      operationId: updateProjectIssueType
      summary: Изменить подпись, цвет, форму, значок или порядок типа — только ADMIN проекта
      description: Пропущенное поле не меняется. "icon":null убирает значок; для остальных полей явный null — 400. Пустое тело — 400 INVALID_ARGUMENT. Недопустимые name, color, icon, shape или sortOrder — 400 INVALID_ARGUMENT.
      tags: [project-issue-type]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{1,31}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProjectIssueTypeRequestDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectIssueTypeDto'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      x-pat-scope: write
      operationId: deleteProjectIssueType
      summary: Удалить неиспользуемый тип — только ADMIN; последний тип удалить нельзя
      description: Считаются только живые задачи. 400 FAILED_PRECONDITION содержит details.reason LAST_ISSUE_TYPE либо ISSUE_TYPE_IN_USE. Строковое details.issueCount передаётся только при ISSUE_TYPE_IN_USE; у LAST_ISSUE_TYPE его нет. Удалённые задачи не запрещают удаление типа.
      tags: [project-issue-type]
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{1,31}$'
      responses:
        '204':
          description: Success
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  schemas:
    IssueShortResponseDto:
      type: object
      required: [id, issueKey, summary, issueType, priority, assigneeId, statusKey]
      properties:
        id:
          type: string
        issueKey:
          type: string
        summary:
          type: string
        issueType:
          $ref: '#/components/schemas/IssueTypeDto'
        issueTypeName:
          type: string
          nullable: true
          description: Имя из текущего реестра проекта; может отсутствовать для удалённого типа.
        issueTypeColor:
          type: string
          nullable: true
        issueTypeIcon:
          type: string
          nullable: true
          description: Значок из реестра проекта; null, если у типа нет значка или тип удалён.
        issueTypeShape:
          nullable: true
          description: Форма из реестра проекта; null только вместе с issueTypeName (тип удалён).
          allOf:
            - $ref: '#/components/schemas/ProjectIssueTypeShapeDto'
        priority:
          $ref: '#/components/schemas/IssuePriorityDto'
        assigneeId:
          type: string
        storyPoints:
          type: number
          format: double
          description: Оценка сложности задачи в story points
          minimum: 0
        projectId:
          type: string
        projectKey:
          type: string
        statusKey:
          type: string
          description: Открытый ключ статуса из workflow проекта; набор не ограничен enum.
    ProjectIssueTypeShapeDto:
      type: string
      description: Форма метки типа. Встроенные типы новых проектов — TASK и STORY square, BUG circle, без значка.
      enum: [square, circle, diamond]
    ProjectIssueTypeDto:
      type: object
      description: Тип задачи из реестра проекта. Облик — цвет, форма и необязательный значок.
      required: [code, name, color, shape, icon, sortOrder]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: Неизменяемый ключ типа внутри проекта.
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          $ref: '#/components/schemas/ProjectIssueTypeColorDto'
        shape:
          $ref: '#/components/schemas/ProjectIssueTypeShapeDto'
        icon:
          nullable: true
          description: Значок типа; null — без значка.
          allOf:
            - $ref: '#/components/schemas/ProjectIssueTypeIconDto'
        sortOrder:
          type: integer
          format: int32
          minimum: 0
    ListProjectIssueTypesDto:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Реестр типов по sortOrder и code; у каждого типа есть shape, icon может быть null.
          items:
            $ref: '#/components/schemas/ProjectIssueTypeDto'
    CreateProjectIssueTypeRequestDto:
      type: object
      additionalProperties: false
      required: [code, name, color]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          $ref: '#/components/schemas/ProjectIssueTypeColorDto'
        shape:
          description: По умолчанию square; явный null запрещён.
          allOf:
            - $ref: '#/components/schemas/ProjectIssueTypeShapeDto'
        icon:
          nullable: true
          description: Пропуск или null — тип без значка.
          allOf:
            - $ref: '#/components/schemas/ProjectIssueTypeIconDto'
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          default: 100
    PatchProjectIssueTypeRequestDto:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Пропущенное поле не меняется. Явный null допустим только для icon и убирает значок; для остальных полей он запрещён. code неизменяем.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          $ref: '#/components/schemas/ProjectIssueTypeColorDto'
        shape:
          $ref: '#/components/schemas/ProjectIssueTypeShapeDto'
        icon:
          nullable: true
          description: Новый значок; null убирает значок.
          allOf:
            - $ref: '#/components/schemas/ProjectIssueTypeIconDto'
        sortOrder:
          type: integer
          format: int32
          minimum: 0
    ProjectContextResponseDto:
      type: object
      required: [ project, members, labels, workflows, issueTypes ]
      properties:
        project:
          $ref: '#/components/schemas/ProjectResponseDto'
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMemberDetailsDto'
        labels:
          type: array
          description: Порядок — name asc, id asc (сравнение строк по collation БД).
          items:
            $ref: '#/components/schemas/ProjectLabelResponseDto'
        issueTypes:
          type: array
          description: Реестр типов проекта по sortOrder и code; первый тип — по умолчанию. Облик каждого типа — color, shape и icon (null — без значка).
          items:
            $ref: '#/components/schemas/ProjectIssueTypeDto'
        workflows:
          type: array
          description: Workflows поддерживаемых типов проекта
          items:
            $ref: '#/components/schemas/ProjectWorkflowEntryDto'
    MetaResponseDto:
      type: object
      description: Словари значений API с английскими названиями. Значения с selectable=false служат только для отображения ответов и не предлагаются для выбора.
      required: [ issueTypes, priorities, linkTypes, notificationTypes, userStatuses ]
      properties:
        issueTypes:
          description: Имена начального посева TASK/BUG/STORY; актуальные названия, цвет, форма и значок берутся из реестра конкретного проекта.
          type: array
          items:
            $ref: '#/components/schemas/IssueTypeMetaPairDto'
        priorities:
          type: array
          items:
            $ref: '#/components/schemas/IssuePriorityMetaPairDto'
        linkTypes:
          type: array
          items:
            $ref: '#/components/schemas/IssueLinkTypeMetaPairDto'
        linkViewTypes:
          type: array
          description: Направления связей, включая обратные; коды совпадают с viewLinkType в ответе связей.
          items:
            $ref: '#/components/schemas/IssueLinkViewTypeMetaPairDto'
        notificationTypes:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTypeMetaPairDto'
        userStatuses:
          type: array
          items:
            $ref: '#/components/schemas/UserStatusMetaPairDto'
