# Pending gateway contract — backend PR #208 (TAS-381)
# A project's own workflows over REST: list every workflow the project runs on, create
# one, add a status, add a transition — and three transitions the default workflow lacked
#
# Source: https://github.com/VladislavYurin/taska-backend/pull/208
# Head commit: 9a04e99cc060356d84aec69db83f274d48af720d
# PR state on 2026-10-21: open, MERGEABLE, no human review yet (author 3x6th)
# Base for this extract: develop @ e8a8d316b3260450798efbda885850d7fab06b16
# Pinned 2026-10-21 in TAS-382
#
# Three new paths and seven schemas: six new, and `WorkflowTransitionDto` gaining an
# optional `hidden`. `GET /api/v1/projects/{projectId}/workflow` differs from develop only
# by the trailing comment banner of the next section, which this directory does not report.
#
# Not deployed on 2026-10-21: `GET /api/v1/projects/not-a-uuid/workflows` and
# `POST …/workflows/not-a-uuid/statuses` answer the static-resource 404 without a token
# (77aa41cc-819e-4537-a0e4-1b31af169eb9, b590752a-5707-4922-a224-f89a040a1635), while
# `GET …/workflow?issueType=TASK` on the same bad id answers 400 INVALID_ARGUMENT
# (3504f043-0c17-415b-8209-961a7052ac3b) — the control.
#
# Not on the wire through this file: migration 0001 adds IN_PROGRESS→TODO (Stop Progress),
# TODO→DONE (Close) and DONE→TODO (Back to To Do) to the shared default workflow, and a
# unique index on a transition's status pair within a workflow. Every project still on the
# default workflow gets the three transitions through `GET /projects/{projectId}/context`
# on the day it deploys, with no frontend change.
#
# This is NOT the contract. It is what the contract WILL say if this PR merges as it
# stands. docs/contract/openapi.yml stays the authority until then; this file exists so a
# reviewer without network access can audit frontend work written ahead of the merge, and
# so the version that work was written against is pinned in history. Delete it when the PR
# merges and the snapshot is refreshed.
#
# Extracted mechanically: every path and schema that is new in the PR, or whose text differs
# from develop. Ordering follows the PR file.

paths:
  /api/v1/projects/{projectId}/workflows:
    get:
      summary: Все workflow проекта со всеми статусами и переходами
      description: |
        Возвращает каждый workflow, по которому работают задачи проекта, один раз: с типами задач,
        которые по нему работают, всеми статусами и всеми переходами, включая скрытые (hidden = true).
        Тип задачи без своего workflow проекта работает по общему default workflow (shared = true).
        Default workflow не меняется: чтобы завести свои статусы и переходы, создайте workflow проекта.
        Доступно любому участнику проекта.
      operationId: listProjectWorkflows
      tags:
        - workflow
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          description: Уникальный идентификатор проекта (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow проекта получены
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWorkflowsResponseDto'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

    post:
      summary: Создание своего workflow проекта
      description: |
        Создаёт workflow проекта со своими статусами и переходами и привязывает к нему указанные типы задач.
        Тип задачи, у которого в проекте уже есть свой workflow, повторно привязать нельзя (409).
        Внимание: issue-service пока создаёт новые задачи в статусе с ключом TODO. Если такого статуса
        в workflow нет, новые задачи этого типа окажутся в статусе, которого в workflow нет.
        Требуется роль ADMIN в проекте.
      operationId: createProjectWorkflow
      tags:
        - workflow
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          description: Уникальный идентификатор проекта (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequestDto'
      responses:
        '201':
          description: Workflow создан
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/projects/{projectId}/workflows/{workflowId}/statuses:
    post:
      summary: Добавление статуса в workflow проекта
      description: |
        Добавляет статус в свой workflow проекта. Ключ статуса и sortOrder должны быть уникальны внутри workflow.
        Общий default workflow (shared = true) не меняется (400 FAILED_PRECONDITION).
        Требуется роль ADMIN в проекте. Возвращает workflow целиком.
      operationId: addWorkflowStatus
      tags:
        - workflow
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          description: Уникальный идентификатор проекта (UUID)
          schema:
            type: string
            format: uuid
        - name: workflowId
          in: path
          required: true
          description: Идентификатор workflow проекта (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowStatusRequestDto'
      responses:
        '201':
          description: Статус добавлен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Статус с таким ключом в workflow уже есть
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/projects/{projectId}/workflows/{workflowId}/transitions:
    post:
      summary: Добавление перехода в workflow проекта
      description: |
        Разрешает переход между двумя статусами своего workflow проекта. Статусы задаются ключами.
        Переход из статуса в него же запрещён, пара статусов не повторяется, sortOrder уникален внутри workflow.
        Общий default workflow (shared = true) не меняется (400 FAILED_PRECONDITION).
        Требуется роль ADMIN в проекте. Возвращает workflow целиком.
      operationId: addWorkflowTransition
      tags:
        - workflow
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          description: Уникальный идентификатор проекта (UUID)
          schema:
            type: string
            format: uuid
        - name: workflowId
          in: path
          required: true
          description: Идентификатор workflow проекта (UUID)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowTransitionRequestDto'
      responses:
        '201':
          description: Переход добавлен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Переход между этими статусами в workflow уже есть
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

components:
  schemas:
    WorkflowTransitionDto:
      type: object
      required: [ id, fromStatusId, toStatusId, name, sortOrder ]
      properties:
        id:
          type: string
          format: uuid
        fromStatusId:
          type: string
          format: uuid
        toStatusId:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        hidden:
          type: boolean
          description: Скрытый переход. GET /projects/{projectId}/workflow скрытые не отдаёт, GET /projects/{projectId}/workflows отдаёт все.
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    WorkflowStatusCategoryDto:
      type: string
      description: Системная категория статуса для группировки и семантики
      enum:
        - TODO
        - IN_PROGRESS
        - DONE

    CreateWorkflowStatusRequestDto:
      type: object
      required: [ statusKey, name, category, sortOrder ]
      properties:
        statusKey:
          type: string
          description: Стабильный ключ статуса, уникальный внутри workflow. Формат ^[A-Z][A-Z0-9_]{1,63}$
          example: CODE_REVIEW
        name:
          type: string
          description: Отображаемое имя статуса, до 100 символов
          example: Code Review
        category:
          $ref: '#/components/schemas/WorkflowStatusCategoryDto'
        sortOrder:
          type: integer
          format: int32
          description: Порядок колонки на доске, не меньше нуля и уникален внутри workflow
          example: 25

    CreateWorkflowTransitionRequestDto:
      type: object
      required: [ fromStatusKey, toStatusKey, name, sortOrder ]
      properties:
        fromStatusKey:
          type: string
          description: Ключ исходного статуса workflow
          example: IN_PROGRESS
        toStatusKey:
          type: string
          description: Ключ целевого статуса workflow
          example: TODO
        name:
          type: string
          description: Отображаемое имя перехода, до 100 символов
          example: Stop Progress
        sortOrder:
          type: integer
          format: int32
          description: Порядок перехода, не меньше нуля и уникален внутри workflow
          example: 40
        hidden:
          type: boolean
          description: Скрытый переход (не показывается в UI, но доступен программно)
          default: false

    CreateWorkflowRequestDto:
      type: object
      required: [ name, issueTypes, statuses, transitions ]
      properties:
        name:
          type: string
          description: Отображаемое имя workflow, до 100 символов
          example: Development
        issueTypes:
          type: array
          description: Типы задач проекта, которые будут работать по этому workflow
          items:
            $ref: '#/components/schemas/IssueTypeDto'
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/CreateWorkflowStatusRequestDto'
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/CreateWorkflowTransitionRequestDto'

    ProjectWorkflowDto:
      type: object
      required: [ workflow, issueTypes, shared ]
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowResponseDto'
        issueTypes:
          type: array
          description: Типы задач проекта, которые работают по этому workflow
          items:
            $ref: '#/components/schemas/IssueTypeDto'
        shared:
          type: boolean
          description: Общий default workflow. Не меняется; для своих статусов и переходов создайте workflow проекта.

    ProjectWorkflowsResponseDto:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectWorkflowDto'
