# Pending gateway contract — backend PR #194 (TAS-228)
# Roles on the watcher routes and on the two deprecated issue PUTs (text only, no Java)
#
# Source: https://github.com/VladislavYurin/taska-backend/pull/194
# Head commit: a33ed5dcd9e5dcd770102a71e0d165e929be03ae
# PR state on 2026-10-17: open, MERGEABLE, REVIEW_REQUIRED, base develop
# Base for this extract: develop @ 4277199e2c993d0041e7bc2e1aa67e52be762c79
#
# This is NOT the contract. It is what the contract WILL say if this PR merges as it
# stands. docs/contract/openapi.yml stays the authority until then. Delete this file when
# the PR merges and the snapshot is refreshed. Where this extract and the PR's Java
# disagree, the Java wins.
#
# Extracted mechanically for TAS-263: every path and schema block of the head's
# openapi.yml whose text differs from the base, copied whole. Nothing is new; no block
# was removed.
#
# Description text only. The four watcher routes describe IssueWatcherServiceImpl.checkMutationRole,
# which was already the runtime rule at develop. PATCH /api/v1/issues/{issueId} still states no role.
paths:
  # text differs from develop
  /api/v1/issues/{issueId}:
    get:
      summary: Возвращает задачу с историей
      operationId: getIssue
      tags:
        - issue
      security:
        - bearerAuth: []

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Задача с историей успешно найдена
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetailsWithHistoryResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

    put:
      summary: Обновляет основные поля задачи
      description: |
        Устарел, используйте PATCH /api/v1/issues/{issueId}.
        Вызывающий должен иметь роль из `update-issue-roles`: по умолчанию ADMIN или MEMBER.
        Не участник проекта получает 403 «Access denied», неподходящая роль — 403 «Not allowed role».
        Список настраивается через ISSUE_UPDATE_ROLES; стенд может переопределить значения по умолчанию.
      deprecated: true
      operationId: updateIssue
      tags:
        - issue
      security:
        - bearerAuth: []

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequestDto'

      responses:
        '200':
          description: Данные задачи успешно обновлены
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateIssueResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      summary: Выполняет мягкое удаление задачи
      operationId: deleteIssue
      tags:
        - issue
      security:
        - bearerAuth: []

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

      responses:
        '204':
          description: Задача успешно удалена (No Content)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
        default:
          $ref: '#/components/responses/ErrorResponse'

    patch:
      summary: Частично обновляет задачу с оптимистичной блокировкой по версии
      description: |
        Поля, которые можно передать: summary, description, priority, assigneeId, storyPoints, startDate, 
        dueDate, originalEstimateMinutes, remainingEstimateMinutes
        Все поля PatchIssueRequestDto необязательные. Отсутствие поля в теле запроса — не изменять значение.
        Явно переданный null — очистить значение (для полей, допускающих NULL в БД;
        summary и priority очищены быть не могут).
        Заголовок If-Match должен содержать текущую версию задачи (Issue.version).
        Если версия не совпадает с версией в БД, изменения не применяются и возвращается 409
        с актуальным состоянием задачи.
      operationId: patchIssue
      tags:
        - issue
      security:
        - bearerAuth: []

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: |
            Версия задачи для оптимистичной блокировки (Issue.version).
            Принимается как число (3), так и в формате ETag в кавычках ("3").
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchIssueRequestDto'

      responses:
        '200':
          description: Задача успешно обновлена
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponseDto'
        '409':
          description: >-
            Версия из If-Match не совпадает с текущей версией задачи в БД (конфликт
            конкурентного изменения). Тело ответа содержит актуальное состояние задачи.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'
  # text differs from develop
  /api/v1/issues/{issueId}/assignee:
    put:
      summary: Назначает исполнителя задачи
      description: |
        Устарел, используйте PATCH /api/v1/issues/{issueId}.
        Назначающий и назначаемый должны иметь роль из `assign-issue-roles`: по умолчанию ADMIN или MEMBER.
        При назначении себя проверяется только роль вызывающего; при назначении другого пользователя — роли обоих.
        Не участник проекта получает 403 «Access denied», неподходящая роль — 403 «Not allowed role».
        Список настраивается через ISSUE_ASSIGN_ROLES; стенд может переопределить значения по умолчанию.
      deprecated: true
      operationId: assignIssue
      tags:
        - issue
      security:
        - bearerAuth: []

      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignIssueRequestDto'

      responses:
        '200':
          description: Исполнитель задачи успешно назначен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'
  # text differs from develop
  /api/v1/projects/{projectId}/issues/{issueId}/watchers:
    get:
      summary: Получение списка подписчиков задачи
      operationId: listIssueWatchers
      tags:
        - watchers
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список подписчиков задачи успешно получен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIssueWatchersResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

    post:
      summary: Добавление подписчика на задачу с проверкой проектной роли
      description: |
        Подписывает указанного пользователя (`userId` в body) на задачу.
        Для чужого userId проверяется роль вызывающего из `manage-watchers-roles` (по умолчанию ADMIN).
        Для своего userId проверяется роль вызывающего из `watch-issue-roles` (по умолчанию ADMIN или MEMBER).
        VIEWER при настройках по умолчанию получает 403.
        Списки настраиваются через ISSUE_MANAGE_WATCHERS_ROLES и ISSUE_WATCH_ROLES;
        стенд может переопределить значения по умолчанию.
      operationId: addIssueWatcher
      tags:
        - watchers
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddIssueWatcherRequestDto'
      responses:
        '200':
          description: Подписчик успешно добавлен
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchIssueResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  # text differs from develop
  /api/v1/projects/{projectId}/issues/{issueId}/watchers/me:
    put:
      summary: Подписка текущего пользователя на задачу
      description: |
        userId берётся из Gateway context (JWT), не из тела запроса.
        Проверяется роль текущего пользователя из `watch-issue-roles`: по умолчанию ADMIN или MEMBER.
        VIEWER при настройках по умолчанию получает 403.
        Список настраивается через ISSUE_WATCH_ROLES; стенд может переопределить значения по умолчанию.
      operationId: watchIssueMe
      tags:
        - watchers
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Пользователь подписан на задачу
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchIssueResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      summary: Отписка текущего пользователя от задачи
      description: |
        userId берётся из Gateway context (JWT), не из path.
        Проверяется роль текущего пользователя из `watch-issue-roles`: по умолчанию ADMIN или MEMBER.
        VIEWER при настройках по умолчанию получает 403.
        Список настраивается через ISSUE_WATCH_ROLES; стенд может переопределить значения по умолчанию.
      operationId: unwatchIssueMe
      tags:
        - watchers
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Пользователь отписан от задачи
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnwatchIssueResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  # text differs from develop
  /api/v1/projects/{projectId}/issues/{issueId}/watchers/{userId}:
    delete:
      summary: Удаление подписчика задачи с проверкой проектной роли
      description: |
        Для чужого userId проверяется роль вызывающего из `manage-watchers-roles` (по умолчанию ADMIN).
        Для своего userId проверяется роль вызывающего из `watch-issue-roles` (по умолчанию ADMIN или MEMBER).
        VIEWER при настройках по умолчанию получает 403; MEMBER может отписать себя, но не другого пользователя.
        Списки настраиваются через ISSUE_MANAGE_WATCHERS_ROLES и ISSUE_WATCH_ROLES;
        стенд может переопределить значения по умолчанию.
      operationId: removeIssueWatcher
      tags:
        - watchers
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          description: Идентификатор пользователя, которого нужно отписать
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Подписчик успешно удалён
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnwatchIssueResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  ########################## Окончание API watchers ##################
