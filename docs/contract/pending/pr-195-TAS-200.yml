# Pending gateway contract — backend PR #195 (TAS-200)
# retryable in the problematic-outbox summary; the retry rule stated on the command
#
# Source: https://github.com/VladislavYurin/taska-backend/pull/195
# Head commit: 45c22ee7e7a80d1c9222c54a9ba6f01aa0f30336
# PR state on 2026-10-17: open, MERGEABLE, REVIEW_REQUIRED, base develop
# Base for this extract: develop @ 4277199e2c993d0041e7bc2e1aa67e52be762c79
#
# This is NOT the contract. It is what the contract WILL say if this PR merges as it
# stands. docs/contract/openapi.yml stays the authority until then. Delete this file when
# the PR merges and the snapshot is refreshed. Where this extract and the PR's Java
# disagree, the Java wins.
#
# Extracted mechanically for TAS-263: every path and schema block of the head's
# openapi.yml whose text differs from the base, copied whole. Nothing is new; no block
# was removed.
#
# The inline '400' on the retry route drops the X-Request-Id header that
# components.responses.ErrorResponse declares; the header is still sent (GatewayErrorHandler).
paths:
  # text differs from develop
  /api/v1/admin/outbox/{service}/{eventId}/retry:
    post:
      summary: Повторная обработка outbox-события (только для GLOBAL_ADMIN)
      description: >-
        Допускает FAILED либо PROCESSING с ненулевым processingStartedAt строго раньше текущего времени
        минус ADMIN_OUTBOX_RETRY_STUCK_THRESHOLD (по умолчанию 10 минут). NEW и PUBLISHED не допускаются.
        retryable из сводки является снимком; состояние проверяется повторно, включая атомарный UPDATE.
      operationId: retryOutboxEvent
      tags:
        - admin
      security:
        - bearerAuth: [ ]

      parameters:
        - name: service
          in: path
          required: true
          description: Сервис-владелец outbox-события
          schema:
            $ref: '#/components/schemas/OutboxServiceTypeDto'

        - name: eventId
          in: path
          required: true
          description: Идентификатор outbox-события
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryOutboxEventRequestDto'

      responses:
        '200':
          description: Outbox-событие успешно отправлено на повторную обработку
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryOutboxEventResponseDto'

        '400':
          description: >-
            FAILED_PRECONDITION: событие не удовлетворяет правилу retry или изменилось после чтения сводки.
            Также возвращается при невалидных параметрах запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestErrorResponse'

        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

########################## API для сброса блокировки учетных данных ##################
components:
  schemas:
    # text differs from develop
    ProblematicOutboxEventDto:
      type: object
      required: [retryable]
      properties:
        retryable:
          type: boolean
          description: >-
            Снимок пригодности к ручному retry: true для FAILED либо для PROCESSING с ненулевым
            processingStartedAt строго раньше текущего времени минус ADMIN_OUTBOX_RETRY_STUCK_THRESHOLD
            (по умолчанию 10 минут). Для NEW и PUBLISHED — false. Состояние может измениться;
            команда retry повторно проверяет правило и может отказать.
        id:
          type: string
        aggregateType:
          type: string
        aggregateId:
          type: string
        eventType:
          type: string
        payload:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        attempts:
          type: integer
          format: int32
        lastErrorMessage:
          type: string
        processingStartedAt:
          type: string
          format: date-time
        requestId:
          type: string
        serviceKey:
          type: string
        reason:
          type: string
