# Pending gateway contract — backend PR #150 (TAS-129)
# The current user's avatar: presigned upload, confirm, delete, and a download URL per user
#
# Source: https://github.com/VladislavYurin/taska-backend/pull/150
# Head commit: 12e909d42dcc81796faa4d0629f980fa8785f69c
# PR state on 2026-09-12: open, MERGEABLE, base develop
# Base for this extract: develop @ 21a0d9d177a1b4be3ae303381f453c05bbd98e13
#
# Four routes, all answering the static-resource **404** today (probed 2026-09-12 without a
# token, with GET /users/me answering 401 in the same run as the control) — so these four,
# unlike PR #152's members route and PR #155's PATCH, are the signature
# `isUndeployedRoute` in src/api/errors.ts already matches.
#
# This is NOT the contract. It is what the contract WILL say if this PR merges as it
# stands. docs/contract/openapi.yml stays the authority until then; this file exists so a
# reviewer without network access can audit frontend work written ahead of the merge, and
# so the version that work was written against is pinned in history. Delete it when the PR
# merges and the snapshot is refreshed.
#
# Extracted mechanically: every path and schema that is new in the PR, or whose text differs
# from develop. Ordering follows the PR file.
#
# Four readings that decide the shape of any UI built on this, taken at the head above.
#
# - **The upload is the same presigned choreography as attachments** (TAS-190, backend PR
#   #147): ask the gateway for a URL, PUT the bytes to a host that is not the gateway, then
#   confirm. `TaskaApi.putAttachmentBytes` and its `AttachmentUploadError` are the precedent
#   AGENTS.md's "a leg that is not a gateway request" paragraph was written about, and the
#   same rule applies here — the cross-origin PUT needs an error type the gateway-error
#   predicates provably do not match.
# - **The declared ceiling is 5 MB and the enforced one is 2 MB, and that is a contract bug
#   rather than a subtlety.** `sizeBytes` is declared `minimum: 1, maximum: 5242880` and the
#   description says 5 MB in as many words. What actually enforces it is
#   `S3StorageClient.validateFileParams`, reading `storage.max-file-size-bytes` from
#   auth-service's own `application.yml`, which is `2097152 # 2 MB` — the same number the
#   attachments bucket uses. So a 3 MB image passes the gateway's bean validation and is
#   then refused a layer deeper. A client that trusts the schema offers the user a file the
#   product will not take. Raised on TAS-129 while the PR is open; until it is settled the
#   client enforces the number that is enforced, not the number that is declared.
# - **The allowed types are `image/jpeg`, `image/png` and `image/webp`**, from the same
#   configuration block, compared by exact string. The bucket is `taska-avatars` and the
#   presigned TTL is 15 minutes — all three read at the head above rather than assumed from
#   the attachments bucket, which is configured separately and happens to agree on the size.
# - **`GET /users/me` does not carry an avatar.** Nothing in this PR puts one on the profile
#   read, so the current user's picture costs a second request to
#   `GET /users/{userId}/avatar`. A *member list* is the opposite case and does not need it:
#   PR #152's `ProjectMemberDetailsDto` carries the avatar with its `downloadUrl` inline, so
#   a board full of faces is one read, not N.
# - **"No avatar" is a 200 with a null `url`**, not a 404:
#   `UserProfileMapper.toRestGetAvatarDownloadUrlResponse` writes `null` when the proto has
#   no url. So a client must read the field rather than the status, and `DELETE` is declared
#   idempotent — 204 whether or not there was an avatar.

paths:

  ########################## API userProfile ########################

  /api/v1/users/me/avatar/upload-url:
    post:
      summary: Запрос presigned URL для загрузки аватара текущего пользователя
      operationId: createAvatarUploadUrl
      tags:
        - user-profile
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAvatarUploadUrlRequestDto'
      responses:
        '200':
          description: Presigned URL для загрузки успешно сгенерирован
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAvatarUploadUrlResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/users/me/avatar/confirm:
    post:
      summary: Подтверждение загрузки аватара текущего пользователя
      description: |
        Вызывается после успешной загрузки файла в хранилище по presigned URL.
        Валидирует загруженный файл и сохраняет метаданные в БД.
      operationId: confirmAvatarUpload
      tags:
        - user-profile
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAvatarUploadRequestDto'
      responses:
        '200':
          description: Аватар успешно подтверждён и сохранён
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/users/me/avatar:
    delete:
      summary: Удаление аватара текущего пользователя
      description: |
        Идемпотентная операция. Если аватар отсутствует, завершается успешно.
        Удаляет запись из БД и файл из хранилища.
      operationId: deleteMyAvatar
      tags:
        - user-profile
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Аватар успешно удалён
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/users/{userId}/avatar:
    get:
      summary: Получение presigned URL для скачивания аватара пользователя
      operationId: getAvatarDownloadUrl
      tags:
        - user-profile
      security:
        - bearerAuth: [ ]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Идентификатор пользователя, чей аватар запрашивается
      responses:
        '200':
          description: Presigned URL для скачивания успешно сгенерирован
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAvatarDownloadUrlResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:

components:
  schemas:

    CreateAvatarUploadUrlRequestDto:
      type: object
      required: [fileName,contentType,sizeBytes]
      properties:
        fileName:
          type: string
          description: Оригинальное имя файла
          minLength: 1
          maxLength: 255
          example: "avatar.png"
        contentType:
          type: string
          description: MIME-тип загружаемого файла
          example: "image/png"
        sizeBytes:
          type: integer
          format: int64
          description: Размер файла в байтах (макс. 5 MB)
          minimum: 1
          maximum: 5242880
          example: 120000

    CreateAvatarUploadUrlResponseDto:
      type: object
      properties:
        uploadUrl:
          type: string
          description: Presigned URL для загрузки файла в хранилище
        objectKey:
          type: string
          description: Ключ объекта в хранилище (необходим для подтверждения загрузки)
        expiresIn:
          type: integer
          format: int64
          description: Время жизни presigned URL в секундах

    ConfirmAvatarUploadRequestDto:
      type: object
      required: [objectKey, fileName, contentType]
      properties:
        objectKey:
          type: string
          description: Ключ объекта в хранилище (получен из ответа на запрос upload-url)
        fileName:
          type: string
          description: Оригинальное имя файла
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          description: MIME-тип загруженного файла

    AvatarResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        objectKey:
          type: string
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          description: Presigned URL для скачивания аватара

    GetAvatarDownloadUrlResponseDto:
      type: object
      properties:
        url:
          type: string
          description: Presigned URL для скачивания аватара (отсутствует, если у пользователя нет аватара)
          nullable: true
