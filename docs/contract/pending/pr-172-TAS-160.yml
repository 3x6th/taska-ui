# Pending gateway contract — backend PR #172 (TAS-160)
# Audit log read for GLOBAL_ADMIN
#
# Source: https://github.com/VladislavYurin/taska-backend/pull/172
# Head commit: 907fa1e4aeb868b57bf20bb939e60759ecd88298
# PR state on 2026-10-10: open, MERGEABLE, CHANGES_REQUESTED, base develop
# Base for this extract: develop @ 485fea5e26a7a9bc1d9ec0832beaf2e1da01c573
#
# This is NOT the contract. It is what the contract WILL say if this PR merges as it
# stands. docs/contract/openapi.yml stays the authority until then. Delete this file when
# the PR merges and the snapshot is refreshed. Where this extract and the PR's Java
# disagree, the Java wins — see docs/ai/API-DIVERGENCE.md for what TAS-251 found.
#
# Restricted to the audit path and its two schemas: the branch is behind develop, so a blind
# diff also reports issue, comment, watcher, link and attachment schemas that develop has
# since moved past. CHANGES_REQUESTED: the open review findings include the date format of
# createdAtFrom/createdAtTo, so that part is the likeliest to move.
paths:
  # new in this PR
  /api/v1/readonly/audit-entries:
    get:
      summary: Получение списка аудит-записей (только для GLOBAL_ADMIN)
      operationId: listAuditEntries
      tags:
        - admin
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          description: Page number (0-based)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          description: Page size (1-100)
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: actorUserId
          in: query
          description: Фильтр по ID актора
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по типу операции
        - name: targetService
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по целевому сервису
        - name: targetTable
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по целевой таблице
        - name: targetId
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по ID целевого объекта
        - name: requestId
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по ID запроса
        - name: createdAtFrom
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по началу периода
        - name: createdAtTo
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по концу периода
      responses:
        '200':
          description: Данные успешно получены
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditEntriesResponseDto'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

components:
  schemas:
  # new in this PR
    ListAuditEntriesResponseDto:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntryDto'
        pagination:
          $ref: '#/components/schemas/PaginationInfoDto'

  # new in this PR
    AuditEntryDto:
      type: object
      properties:
        actorUserId:
          type: string
          format: uuid
        actorLogin:
          type: string
        action:
          type: string
        targetService:
          type: string
        targetTable:
          type: string
        targetId:
          type: string
        oldValue:
          type: string  # changed from object to string
          description: JSON string representation of old value
        newValue:
          type: string  # changed from object to string
          description: JSON string representation of new value
        reason:
          type: string
        requestId:
          type: string
        createdAt:
          type: string
          format: date-time

