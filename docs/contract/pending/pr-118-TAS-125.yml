# Pending gateway contract — backend PR #118 (TAS-125)
# Board API and readonly metadata
#
# Source: https://github.com/VladislavYurin/taska-backend/pull/118
# Head commit: 8a8326e19f9f5eecaf17f01e4876f1fec1ab9560
# PR state on 2026-09-05: open, CHANGES_REQUESTED
# Base for this extract: develop @ 8b8b3c5aca210175322d5f1d092c61ffcd3cfeb3
#
# The branch is long out of date with develop (1794 lines against 2798), so a plain diff shows
# labels, watchers, search and outbox as "removed" when they are only absent from a stale base.
# This extract is therefore restricted to the two routes the PR actually adds and their schemas.
# CHANGES_REQUESTED: the reviewer found no project-access check on the board query or the
# workflow-service call, so this contract may still move.
#
# This is NOT the contract. It is what the contract WILL say if this PR merges as it
# stands. docs/contract/openapi.yml stays the authority until then; this file exists so a
# reviewer without network access can audit frontend work written ahead of the merge, and
# so the version that work was written against is pinned in history. Delete it when the PR
# merges and the snapshot is refreshed.
#
# Extracted mechanically: every path and schema that is new in the PR, or whose text differs
# from develop. Ordering follows the PR file.

paths:

  /api/v1/projects/{projectId}/board:
    get:
      summary: Получение доски задач проекта
      operationId: getBoard
      tags:
        - board
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: issueType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/IssueTypeDto'
        - name: assigneeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: labelId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: includeDone
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Доска успешно сформирована
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardResponseDto'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/readonly/metadata:
    get:
      summary: Получение каталога доступных сервисов и таблиц (только для GLOBAL_ADMIN)
      operationId: getMetadata
      tags:
        - readonly
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Метаданные успешно получены
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-RequestId-Header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

components:
  schemas:

    MetaInfoDto:
      type: object
      properties:
        service:
          type: string
        table:
          type: string
        columns:
          type: array
          items:
            type: string
        sortableColumns:
          type: array
          items:
            type: string
        filterableColumns:
          type: array
          items:
            type: string

    BoardResponseDto:
      type: object
      required: [ projectId, issueType, columns ]
      properties:
        projectId:
          type: string
          format: uuid
        issueType:
          $ref: '#/components/schemas/IssueTypeDto'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/BoardColumnDto'

    BoardColumnDto:
      type: object
      required: [ statusKey, name, category, sortOrder, issues ]
      properties:
        statusKey:
          type: string
        name:
          type: string
        category:
          type: string
        sortOrder:
          type: integer
          format: int32
        issues:
          type: array
          items:
            $ref: '#/components/schemas/BoardIssueDto'

    BoardIssueDto:
      type: object
      required: [ id, issueKey, summary ]
      properties:
        id:
          type: string
          format: uuid
        issueKey:
          type: string
        summary:
          type: string
        storyPoints:
          type: integer
          format: int32
        assignee:
          $ref: '#/components/schemas/BoardUserDto'
        labels:
          type: array
          items:
            type: string

    BoardUserDto:
      type: object
      required: [ id ]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
