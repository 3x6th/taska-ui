# Pending gateway contract — backend PR #219 (TAS-388)
# The user's separate login is removed; the audit log records the actor's name and email
#
# Source: https://github.com/VladislavYurin/taska-backend/pull/219
# Head commit: e9013d2a8a69
# PR state on 2026-10-23: open, opened the same day by the backend developer, one commit
# Extracted 2026-10-23 in TAS-389
# Base for this extract: develop @ 3a2644f741afc50d1796ad8ecdba7e559c3ddb2c
#
# Two schemas change and no path does. `login` leaves `ValidateAccessTokenResponseDto`, the
# answer of `GET /api/v1/users/me`; `actorLogin` leaves `AuditEntryDto` and `actorDisplayName`
# and `actorEmail` take its place, both nullable. `POST /api/v1/auth/login` keeps its name: it
# is signing in, by email, and its request body never carried a login.
#
# This is NOT the contract. It is what the contract WILL say if this PR merges as it
# stands. docs/contract/openapi.yml stays the authority until then; this file exists so a
# reviewer without network access can audit frontend work written ahead of the merge, and
# so the version that work was written against is pinned in history. Delete it when the PR
# merges and the snapshot is refreshed.
#
# Extracted mechanically: every schema whose text differs from develop. Ordering follows the
# PR file.
#
# What the PR's migrations do that the yml does not say, read at the head above. These are
# the raw tables the admin console reads through `GET /readonly/{service}/{table}`.
#
# - **`auth.users` loses its `login` column** (`auth-service` changeset
#   `0007-remove-user-login`: `ALTER TABLE taska.users DROP COLUMN login`). The Users section
#   reads that table by column name, so the column simply stops arriving.
# - **`admin_audit_log.actor_login` is renamed, not dropped** (`admin-service` changeset
#   `0003-audit-actor-identity`): `actor_login` becomes `actor_display_name` (type `text`), so
#   every historical row keeps its old login there as the "stored actor designation", and a
#   new `actor_email varchar(320)` column is added, empty for every historical row. The
#   original `actor_login` was `varchar(64) NOT NULL` (changeset `0001-admin-audit-log`); a
#   rename keeps that constraint, so in the raw table `actor_display_name` is never null even
#   though the DTO declares it nullable.

components:
  schemas:

    ValidateAccessTokenResponseDto:
      type: object
      required: [avatarUnavailable]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/UserStatusDto'
        globalRole:
          $ref: '#/components/schemas/GlobalRoleTypeDto'
        avatar:
          allOf:
            - $ref: '#/components/schemas/AvatarDto'
          nullable: true
          description: Аватар текущего пользователя; null, если отсутствует или профиль временно недоступен (см. avatarUnavailable).
        avatarUnavailable:
          type: boolean
          default: false
          description: >-
            true, если профиль с аватаром не удалось прочитать и avatar=null означает ошибку,
            а не отсутствие фото. false, если аватар прочитан или у пользователя его нет.

    AuditEntryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор записи журнала
        actorUserId:
          type: string
          format: uuid
        actorDisplayName:
          type: string
          nullable: true
          description: Имя автора на момент действия; для старых записей сохранённое обозначение автора.
        actorEmail:
          type: string
          nullable: true
          description: Email автора на момент действия; null для исторических записей без email.
        action:
          type: string
        targetService:
          type: string
        targetTable:
          type: string
        targetId:
          type: string
        oldValue:
          type: string
          description: Состояние объекта до операции — JSON-строка с замаскированными sensitive-значениями
        newValue:
          type: string
          description: Состояние объекта после операции — JSON-строка с замаскированными sensitive-значениями
        reason:
          type: string
        requestId:
          type: string
        createdAt:
          type: string
          format: date-time
